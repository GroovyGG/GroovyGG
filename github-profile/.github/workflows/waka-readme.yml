name: Waka Readme

on:
  schedule:
    # 每天 UTC 0:30 运行（约北京时间 8:30）
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme with WakaTime Stats
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_LANGUAGE: "True"
          SHOW_PROJECTS: "True"
          # 语言/项目数据来自 WakaTime：需在编辑器装插件并写代码才有统计
          # 更多选项见 https://github.com/anmol098/waka-readme-stats
